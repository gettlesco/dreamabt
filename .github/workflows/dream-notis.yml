name: dream bedtime notis

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: ping bedtime tick
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DREAM_PUSH_URL: ${{ secrets.DREAM_PUSH_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$DREAM_PUSH_URL" ]; then
            echo "CRON_SECRET or DREAM_PUSH_URL is unset; skipping tick."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${DREAM_PUSH_URL}/api/dream/push/tick"
